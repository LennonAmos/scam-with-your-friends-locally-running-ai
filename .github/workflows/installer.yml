name: Installer checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  publish-files:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check publication allowlist
        shell: pwsh
        run: ./Build-Release.ps1 -GamePath unused -CheckOnly

  mono-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Mono compiler and framework libraries
        run: sudo apt-get update && sudo apt-get install -y mono-devel
      - name: Compile shared installer
        run: |
          mcs -target:exe -out:"$RUNNER_TEMP/ScamOllamaSetup.exe" \
            -r:System.Web.Extensions -r:System.IO.Compression \
            -r:System.IO.Compression.FileSystem installer/Setup.cs
      - name: Check Linux entry points
        run: |
          sh -n Install-linux.sh
          sh -n Install-linux-easy.sh
          mono "$RUNNER_TEMP/ScamOllamaSetup.exe" --help --no-pause
          mono "$RUNNER_TEMP/ScamOllamaSetup.exe" --instructions --no-pause
